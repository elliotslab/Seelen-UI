name: "Release"

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

jobs:
  continuous-integration:
    uses: ./.github/workflows/ci.yml

  create-release:
    needs: continuous-integration
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}

    steps:
      - uses: actions/checkout@v4
      - name: Get version
        run: echo "PACKAGE_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Create release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const changelogContent = fs.readFileSync('changelog.md', 'utf-8');
            const regex = new RegExp(`(?<=\\[${process.env.PACKAGE_VERSION}\\]\\s)([\\s\\S]*?)(?=\\s## \\[)`, 'g');
            const releaseNotes = changelogContent.match(regex)?.[0].trim() || '';

            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${process.env.PACKAGE_VERSION}`,
              name: `Seelen UI v${process.env.PACKAGE_VERSION}`,
              body: releaseNotes,
              generate_release_notes: true,
              draft: true,
              prerelease: false,
            });
            return data.id;

  build-installers:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-2025"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Rust Nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-09-12
      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm install

      - name: Cache MSIX Hero
        if: matrix.platform == 'windows-2025'
        uses: actions/cache@v4
        with:
          path: |
            C:\Program Files\MSIX Hero
            C:\Program Files (x86)\MSIX Hero
          key: msix-hero-${{ runner.os }}
          restore-keys: |
            msix-hero-

      - name: Install MSIX dependencies
        if: matrix.platform == 'windows-2025'
        shell: pwsh
        run: |
          # Install dependencies with error handling and verification
          Write-Host "Installing .NET dependencies..."
          try {
            winget install --id Microsoft.DotNet.AspNetCore.8 --accept-package-agreements --accept-source-agreements --force --silent
            winget install --id Microsoft.DotNet.DesktopRuntime.8 --accept-package-agreements --accept-source-agreements --force --silent
          } catch {
            Write-Warning "Failed to install .NET dependencies: $_"
          }

          Write-Host "Installing MSIX Hero..."
          try {
            winget install --id MarcinOtorowski.MSIXHero --accept-package-agreements --accept-source-agreements --force --silent
          } catch {
            Write-Warning "Failed to install MSIX Hero via winget: $_"
            Write-Host "Attempting alternative installation..."
            # Fallback: try installing via chocolatey if available
            if (Get-Command choco -ErrorAction SilentlyContinue) {
              choco install msixhero -y
            }
          }

          # Verify installation and add to PATH if needed
          Write-Host "Verifying MSIX Hero installation..."
          $msixHeroPath = Get-Command msixHeroCli -ErrorAction SilentlyContinue
          if (-not $msixHeroPath) {
            # Try to find MSIX Hero in common installation paths
            $possiblePaths = @(
              "${env:ProgramFiles}\MSIX Hero\msixHeroCli.exe",
              "${env:ProgramFiles(x86)}\MSIX Hero\msixHeroCli.exe",
              "${env:LOCALAPPDATA}\Microsoft\WindowsApps\msixHeroCli.exe"
            )

            foreach ($path in $possiblePaths) {
              if (Test-Path $path) {
                $dir = Split-Path $path -Parent
                $env:PATH = "$dir;$env:PATH"
                Write-Host "Added MSIX Hero to PATH: $dir"
                break
              }
            }
          }

          # Final verification
          if (Get-Command msixHeroCli -ErrorAction SilentlyContinue) {
            Write-Host "✅ MSIX Hero CLI is available"
            msixHeroCli --version
          } else {
            Write-Error "❌ MSIX Hero CLI not found after installation attempts"
            exit 1
          }

      - uses: tauri-apps/tauri-action@v0.5.16
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

      - name: Bundle MSIX
        if: matrix.platform == 'windows-2025'
        shell: pwsh
        run: |
          Write-Host "Verifying MSIX Hero CLI before bundling..."
          if (-not (Get-Command msixHeroCli -ErrorAction SilentlyContinue)) {
            Write-Error "❌ MSIX Hero CLI not found. Cannot create MSIX bundle."
            exit 1
          }

          Write-Host "✅ MSIX Hero CLI found. Creating MSIX bundle..."
          try {
            npx tsx scripts/bundle.msix.ts
            Write-Host "✅ MSIX bundle created successfully"
          } catch {
            Write-Error "❌ Failed to create MSIX bundle: $_"
            Write-Host "MSIX Hero CLI version:"
            msixHeroCli --version
            Write-Host "Available files in target/release:"
            Get-ChildItem target/release -Recurse | Select-Object Name, FullName
            throw
          }

      - name: Upload artifacts
        id: artifact-upload-step
        uses: actions/upload-artifact@v4
        with:
          name: build-bundle
          path: target/release/bundle

      - name: Output artifact ID
        run: echo 'Artifact ID is ${{ steps.artifact-upload-step.outputs.artifact-id }}'

  publish-release:
    needs: [build-installers, create-release]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        env:
          releaseId: ${{ needs.create-release.outputs.release_id }}
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          script: |
            const result = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.releaseId,
            });

            result.data.forEach(async (asset) => {
              if (asset.name.endsWith('.sig')) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id,
                });
              }
            });

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.releaseId,
              draft: false,
            });
